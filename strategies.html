<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEV Bot — Strategies</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root { background: #0b1020; card: #121829; text: #e5e7eb; muted: #9ca3af; accent: #22c55e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-monaco,SFMono-Regular,Menlo,Consolas,monospace; background: var(--background); color: var(--text); padding: 24px; }
    nav a, nav a:visited { color: #9ca3af; text-decoration: none; margin-right: 16px; font-size: 13px; }
    nav a.active { color: #22c55e; }
    header { display: flex; align-items: baseline; justify-content: space-between; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; }
    .kpi { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
    .kpi .cell { background: #121829; border: 1px solid #1e2539; border-radius: 8px; padding: 10px 14px; min-width: 130px; }
    .kpi .cell .k { font-size: 22px; color: var(--accent); }
    .kpi .cell .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #1e2539; font-size: 13px; }
    th { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .04em; }
    tr:hover td { background: #161d31; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
    .refresh { color: var(--muted); font-size: 13px; }
    button { background: #0ea5e9; color:#fff; border:0; border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
    button:hover { opacity:.9; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MEV Arbitrage — Strategies</h1>
      <div class="sub">Per-strategy breakdown of discovered (profitable) arbitrage routes</div>
    </div>
    <div><span class="refresh" id="status">loading…</span></div>
  </header>
  <nav>
    <a href="index.html">Opportunities</a>
    <a href="strategies.html" class="active">Strategies</a>
  </nav>

  <div class="kpi">
    <div class="cell"><div class="k" id="k-strat">—</div><div class="l">Strategies</div></div>
    <div class="cell"><div class="k" id="k-routes">—</div><div class="l">Total Routes</div></div>
    <div class="cell"><div class="k" id="k-gross">—</div><div class="l">Σ Gross (ETH)</div></div>
    <div class="cell"><div class="k" id="k-net">—</div><div class="l">Σ Net (ETH)</div></div>
    <div class="cell"><div class="k" id="k-latest">—</div><div class="l">Last Seen (UTC)</div></div>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th>#</th>
        <th>Strategy</th>
        <th>Routes</th>
        <th>Gross (ETH)</th>
        <th>Net (ETH)</th>
        <th>Avg Confidence</th>
        <th>Avg Hops</th>
        <th>Last Seen (UTC)</th>
        <th>Age</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  <script src="strategies.js"></script>
</body>
</html>
